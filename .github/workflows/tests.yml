name: Java

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests and build
        run: mvn -B verify

  load-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start application
        run: docker compose up -d --build --wait todo
      - name: Run k6 smoke test
        run: docker compose --profile load run --rm -e SMOKE=1 loadtest
      - name: Stop services
        if: always()
        run: docker compose down -v